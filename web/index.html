<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUB-SP histórico</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: cabeçalho curto com o mês mais recente, depois uma tabela larga rolável; meses nas linhas, séries nas colunas. */
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --fg: #1f2a24;
    --muted: #6b746f;
    --line: #d9dcd6;
    --accent: #0f6e56;
    --accent-soft: #e3f1ec;
    --neg: #a3412a;
    --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151916; --surface: #1d2320; --fg: #e8ebe6; --muted: #9aa49d; --line: #303833;
      --accent: #5fc9a6; --accent-soft: #1f3a31; --neg: #e08a72; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151916; --surface: #1d2320; --fg: #e8ebe6; --muted: #9aa49d; --line: #303833;
    --accent: #5fc9a6; --accent-soft: #1f3a31; --neg: #e08a72; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .sub strong { color: var(--fg); font-weight: 500; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 500;
    padding: 7px 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 860px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  thead tr:first-child th { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 12px; border-bottom: 0; }
  thead tr:nth-child(2) th { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--fg); border-bottom: 2px solid var(--line); }
  th.grupo { text-align: center; border-left: 1px solid var(--line); }
  td.grupo-ini, th.grupo-ini { border-left: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 2; }
  thead th:first-child { z-index: 3; }
  td { font-family: var(--mono); font-size: 13px; }
  td.mes { font-family: var(--font); font-weight: 500; }
  td.neg { color: var(--neg); }
  tbody tr:first-child td { background: var(--accent-soft); }
  tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
  tbody tr:first-child:hover td { background: var(--accent-soft); }
  .estado { padding: 20px; color: var(--muted); }
  .estado.erro { color: var(--neg); }
  footer { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
  footer a { color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .seg button { transition: background 120ms, color 120ms; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CUB/m² do Estado de São Paulo</h1>
      <p class="sub" id="resumo">Carregando o histórico…</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Medida">
        <button type="button" id="btn-custo" aria-pressed="true">Custo m² (R$)</button>
        <button type="button" id="btn-var" aria-pressed="false">Variação no mês (%)</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <table id="tabela" hidden>
      <thead>
        <tr>
          <th></th>
          <th class="grupo" colspan="4">Padrão Baixo</th>
          <th class="grupo" colspan="4">Padrão Normal</th>
          <th class="grupo" colspan="3">Padrão Alto</th>
        </tr>
        <tr id="cabecalho"><th>Mês</th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <p class="estado" id="estado">Buscando os dados no Supabase…</p>
  </div>

  <footer>
    <span>Fonte: Boletim Econômico sem desoneração do <a href="https://sindusconsp.com.br/servicos/cub/" target="_blank" rel="noopener">Sinduscon-SP</a>, quadro "Custo unitário básico no Estado de São Paulo". Valores em R$/m², conforme NBR 12.721.</span>
    <span id="rodape"></span>
  </footer>
</main>

<script>
  const SUPABASE_URL = "https://mghqcsycuurjezoiiyfp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nGsggiCrChcI-Lfo0pTAnA_bRyllIKS"; // chave pública, só leitura
  const SERIES = [
    ["baixo", "R-1"], ["baixo", "PP-4"], ["baixo", "R-8"], ["baixo", "PIS"],
    ["normal", "R-1"], ["normal", "PP-4"], ["normal", "R-8"], ["normal", "R-16"],
    ["alto", "R-1"], ["alto", "R-8"], ["alto", "R-16"],
  ];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const fmtReal = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtPct = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let linhas = [];      // [{referencia: "2026-10-01", valores: {"baixo|R-1": {custo, var}}}]
  let medida = "custo";

  const $ = (id) => document.getElementById(id);

  function mesCurto(iso) {
    const [ano, mes] = iso.split("-");
    return `${MESES[Number(mes) - 1]}/${ano.slice(2)}`;
  }
  function mesLongo(iso) {
    const [ano, mes] = iso.split("-");
    const nomes = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    return `${nomes[Number(mes) - 1]} de ${ano}`;
  }

  async function carregar() {
    const url = `${SUPABASE_URL}/rest/v1/cub_valores?select=referencia,padrao,tipo,custo_m2,variacao_mes&order=referencia.desc`;
    const resposta = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!resposta.ok) throw new Error(`Supabase respondeu ${resposta.status}`);
    const dados = await resposta.json();
    const porMes = new Map();
    for (const d of dados) {
      if (!porMes.has(d.referencia)) porMes.set(d.referencia, { referencia: d.referencia, valores: {} });
      porMes.get(d.referencia).valores[`${d.padrao}|${d.tipo}`] = { custo: Number(d.custo_m2), var: Number(d.variacao_mes) };
    }
    linhas = [...porMes.values()].sort((a, b) => (a.referencia < b.referencia ? 1 : -1));
  }

  function cabecalho() {
    const tr = $("cabecalho");
    SERIES.forEach(([padrao, tipo], i) => {
      const th = document.createElement("th");
      th.textContent = tipo;
      if (i === 0 || SERIES[i - 1][0] !== padrao) th.className = "grupo-ini";
      tr.appendChild(th);
    });
  }

  function render() {
    const corpo = $("corpo");
    corpo.replaceChildren();
    for (const linha of linhas) {
      const tr = document.createElement("tr");
      const tdMes = document.createElement("td");
      tdMes.className = "mes";
      tdMes.textContent = mesCurto(linha.referencia);
      tdMes.title = mesLongo(linha.referencia);
      tr.appendChild(tdMes);
      SERIES.forEach(([padrao, tipo], i) => {
        const td = document.createElement("td");
        const v = linha.valores[`${padrao}|${tipo}`];
        if (i === 0 || SERIES[i - 1][0] !== padrao) td.classList.add("grupo-ini");
        if (!v) {
          td.textContent = "–";
        } else if (medida === "custo") {
          td.textContent = fmtReal.format(v.custo);
        } else {
          td.textContent = `${fmtPct.format(v.var)}%`;
          if (v.var < 0) td.classList.add("neg");
        }
        tr.appendChild(td);
      });
      corpo.appendChild(tr);
    }
    $("btn-custo").setAttribute("aria-pressed", String(medida === "custo"));
    $("btn-var").setAttribute("aria-pressed", String(medida === "var"));
  }

  function resumo() {
    if (!linhas.length) {
      $("resumo").textContent = "Nenhum mês gravado ainda.";
      return;
    }
    const ultimo = linhas[0];
    const r8n = ultimo.valores["normal|R-8"];
    const primeiro = linhas[linhas.length - 1].referencia;
    $("resumo").innerHTML = `Último mês: <strong>${mesLongo(ultimo.referencia)}</strong>` +
      (r8n ? ` · R-8 Normal a <strong>R$ ${fmtReal.format(r8n.custo)}/m²</strong> (${fmtPct.format(r8n.var)}% no mês)` : "");
    $("rodape").textContent = `${linhas.length} meses gravados, de ${mesLongo(primeiro)} a ${mesLongo(ultimo.referencia)}. ` +
      "Variação no mês é a publicada pelo Sinduscon-SP.";
  }

  $("btn-custo").addEventListener("click", () => { medida = "custo"; render(); });
  $("btn-var").addEventListener("click", () => { medida = "var"; render(); });

  cabecalho();
  carregar().then(() => {
    render();
    resumo();
    $("estado").hidden = true;
    $("tabela").hidden = false;
  }).catch((erro) => {
    $("estado").textContent = `Não foi possível carregar o histórico: ${erro.message}. Recarregue a página; se persistir, confira se o Supabase está no ar.`;
    $("estado").classList.add("erro");
    $("resumo").textContent = "Histórico indisponível.";
  });
</script>
</body>
</html>
