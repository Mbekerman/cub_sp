[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cub-sp"
version = "0.1.0"
description = "Monitor do CUB/m² do Estado de São Paulo: lê o boletim do Sinduscon-SP e grava no Supabase."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "supabase>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
cub-sp = "cub_sp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
